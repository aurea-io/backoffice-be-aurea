name: PR task reference

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-task-reference:
    name: pr-task-reference
    runs-on: ubuntu-latest
    steps:
      - name: Require an executable issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const executableReference = /\b(?:close[sd]?|fix(?:e[sd]?)?|resolve[sd]?)\s+(?:(?:https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/)|(?:[^/\s#]+\/[^/\s#]+#))?#?\d+\b/i;

            if (!executableReference.test(body)) {
              core.setFailed(
                'Este PR debe incluir una referencia ejecutable a una tarea, por ejemplo: "Closes #23". ' +
                'Para una issue de otro repositorio: "Closes aurea-io/REPOSITORIO#23".'
              );
              return;
            }

            core.info('Referencia de tarea encontrada.');
