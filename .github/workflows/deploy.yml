name: Build and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aurea-io/backoffice-be-aurea
  CONTAINER_NAME: aurea-backend
  APP_PORT: '3001'

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install prisma generate
      - run: npm test
      - run: npm run build

  publish:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUREA_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to Render
    if: ${{ vars.AUREA_DEPLOY_ENABLED == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Render configuration
        id: config
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Deploy backend omitido: falta RENDER_DEPLOY_HOOK_URL.'
          fi
      - name: Trigger Render deploy
        if: steps.config.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  notify-image:
    name: Notify image
    if: ${{ always() && needs.publish.result != 'skipped' }}
    needs: [verify, publish]
    uses: aurea-io/aurea-ci/.github/workflows/notify.yml@7b42045
    with:
      event-type: image
      environment: production
      image: ghcr.io/aurea-io/backoffice-be-aurea
      version: ${{ github.sha }}
      source-commit: ${{ github.sha }}
      status: ${{ needs.publish.result == 'success' && needs.verify.result == 'success' && 'success' || 'failure' }}
    secrets: inherit

  notify-deploy:
    name: Notify deploy
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    needs: [publish, deploy]
    uses: aurea-io/aurea-ci/.github/workflows/notify.yml@7b42045
    with:
      event-type: deploy
      environment: production
      source-commit: ${{ github.sha }}
      status: ${{ needs.deploy.result == 'success' && 'success' || 'failure' }}
    secrets: inherit
